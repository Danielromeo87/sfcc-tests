# SFCC Architect Challenge — nginx config
# Served behind a TLS-terminating reverse proxy in production
# (Traefik, Caddy, Cloudflare, ELB, etc.).
# This file adds compression, caching, security headers and a few
# opinionated defaults for static sites.

server {
    listen       80 default_server;
    listen       [::]:80 default_server;
    server_name  _;

    root  /usr/share/nginx/html;
    index index.html;

    # Hide nginx version (defence in depth)
    server_tokens off;

    # ── Compression ────────────────────────────────────────────────────
    # On nginx:alpine gzip is built in. brotli would need a separate module
    # and ~5 MB extra; gzip is enough for static text assets.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        application/javascript
        application/json
        application/manifest+json
        application/xml
        image/svg+xml;

    # ── MIME types ─────────────────────────────────────────────────────
    # Standard MIME types + the .webmanifest one nginx doesn't know by default.
    # Defining a `types` block here replaces the inherited defaults from
    # /etc/nginx/mime.types, so we have to redeclare the essentials.
    types {
        text/html                             html htm shtml;
        text/css                              css;
        text/xml                              xml;
        application/javascript                js;
        application/json                      json;
        application/manifest+json             webmanifest;
        image/svg+xml                         svg svgz;
        image/png                             png;
        image/jpeg                            jpg jpeg;
        image/gif                             gif;
        image/webp                            webp;
        image/x-icon                          ico;
        font/woff                             woff;
        font/woff2                            woff2;
        application/xml                       xml;
        application/octet-stream              bin;
    }
    default_type text/html;

    # ── Security headers (defence in depth; a reverse proxy usually adds
    #    its own, but a few are cheap to set here too) ────────────────
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options        "SAMEORIGIN" always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy     "geolocation=(), microphone=(), camera=()" always;

    # CSP: allow only self + Google Fonts (which the site uses for Manrope/DM Mono).
    # 'unsafe-inline' is needed because the i18n system injects HTML via innerHTML
    # in data-i18n-html elements. Tighten if you migrate to a build-time i18n.
    add_header Content-Security-Policy
        "default-src 'self'; \
         img-src 'self' data:; \
         style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; \
         font-src 'self' https://fonts.gstatic.com; \
         script-src 'self'; \
         connect-src 'self'; \
         frame-ancestors 'none'; \
         base-uri 'self'" always;

    # ── Caching ────────────────────────────────────────────────────────
    # HTML: never cache (so deploys roll out immediately)
    location = / {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        expires off;
        try_files /index.html =404;
    }
    location ~* \.html$ {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        expires off;
        try_files $uri =404;
    }

    # Long-cache assets (versioned files: app.js, styles.css, favicon.svg, og-image.png)
    location ~* \.(?:js|css|svg|png|jpg|jpeg|gif|webp|woff2?|ico)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable" always;
        try_files $uri =404;
    }

    # robots.txt + sitemap.xml: 1 day
    location = /robots.txt  { add_header Cache-Control "public, max-age=86400" always; }
    location = /sitemap.xml { add_header Cache-Control "public, max-age=86400" always; }

    # manifest.webmanifest: 1 day, with the right MIME type
    location = /manifest.webmanifest {
        types { application/manifest+json webmanifest; }
        default_type application/manifest+json;
        add_header Cache-Control "public, max-age=86400" always;
    }

    # SPA fallback: any unknown URL falls back to index.html so the in-page
    # hash routing (#blocks, #topics, #faq…) keeps working on hard refresh.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── Logging ────────────────────────────────────────────────────────
    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log warn;
}
